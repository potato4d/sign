<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*; font-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sign</title>
    <script type="module" src="/index.ts"></script>
  </head>
  <body>
    <header class="tab-bar" aria-label="Open files">
      <div id="tab-list" class="tab-list" role="tablist" aria-label="Editor tabs"></div>
      <button
        id="open-files"
        class="open-files"
        type="button"
        aria-label="Open files"
        title="Open files"
      >
        <span aria-hidden="true">+</span>
      </button>
    </header>
    <main id="editor" aria-label="Text editor" hidden></main>
    <section id="empty-workspace" class="empty-workspace" aria-label="Start editing">
      <div class="empty-workspace__actions">
        <button id="create-empty-file" class="empty-workspace__action" type="button">
          <span class="empty-workspace__icon empty-workspace__icon--new" aria-hidden="true"
            >＋</span
          >
          <span>New File</span>
        </button>
        <button id="open-empty-file" class="empty-workspace__action" type="button">
          <span class="empty-workspace__icon" aria-hidden="true">📁</span>
          <span>Open File</span>
        </button>
      </div>
    </section>
    <div id="drop-overlay" class="drop-overlay" role="status" aria-live="polite" aria-hidden="true">
      <div class="drop-overlay__content">
        <span class="drop-overlay__icon" aria-hidden="true">↓</span>
        <span>Drop files to open</span>
      </div>
    </div>
    <dialog id="quick-switcher" class="quick-switcher" aria-label="Quick switcher">
      <input
        id="quick-switcher-input"
        class="quick-switcher__input"
        type="search"
        placeholder="Switch to an open file"
        aria-label="Filter open files"
        autocomplete="off"
        spellcheck="false"
      />
      <div
        id="quick-switcher-results"
        class="quick-switcher__results"
        role="listbox"
        aria-label="Open files"
      ></div>
    </dialog>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  </body>
</html>
